[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evren-sdk"
dynamic = ["version"]
description = "EVREN Yapay Zeka Platformu — Python SDK for the EVREN LLM gateway (chat, streaming, embeddings, rerank, typed decisions, OCR, speech-to-text) and vision inference (detection, classification, segmentation)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Serkan Peker", email = "serkan.peker@crudfab.com" },
]
maintainers = [
    { name = "Serkan Peker", email = "serkan.peker@crudfab.com" },
]
keywords = [
    "evren", "yapay-zeka", "inference", "object-detection",
    "yolo", "computer-vision", "sdk", "deep-learning",
    "llm", "openai-compatible", "embeddings", "rerank",
    "decision-model", "ocr", "speech-to-text",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
edge = ["opencv-python>=4.8", "websockets>=12.0"]
images = ["Pillow>=10"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "Pillow>=10"]

[project.urls]
Homepage = "https://evren.ssyz.org.tr"
Documentation = "https://github.com/speker/evren-sdk#readme"
Repository = "https://github.com/speker/evren-sdk"
Changelog = "https://github.com/speker/evren-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/speker/evren-sdk/issues"

[tool.hatch.version]
path = "evren_sdk/_version.py"

[tool.hatch.build]
# monorepo .gitignore'daki `_*.py` kuralı _version.py'yi derlemeden düşürüyordu
artifacts = ["evren_sdk/_version.py"]

[tool.hatch.build.targets.wheel]
packages = ["evren_sdk"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# typing.Self 3.11+; paket 3.10'u destekliyor
extend-ignore = ["PYI034"]

[tool.mypy]
python_version = "3.10"
strict = true

# opsiyonel bağımlılıklar (edge, images) kurulu olmayabilir
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "numpy", "numpy.*", "PIL", "PIL.*", "websockets", "websockets.*"]
ignore_missing_imports = true
